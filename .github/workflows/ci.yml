name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3@sha256:55a55347b1b959ae51d40373901e81aa671d7fc9e6d05d0603d1e0ad3ac22c6d
        env:
          CLICKHOUSE_PASSWORD: local-test-only
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -q -O - http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply ClickStack schema
        run: docker exec -i "${{ job.services.clickhouse.id }}" clickhouse-client --password local-test-only --multiquery < clickhouse/schema.sql
      - name: Insert OTLP and query real ClickHouse
        run: npx vitest run test/clickhouse.integration.test.ts
        env:
          CLICKHOUSE_INTEGRATION: '1'
